name: '[OnlyStream] Multi-Platform Build & Release'

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-android:
    name: '[Android] Build'
    runs-on: ubuntu-latest
    steps:
      - name: '[Android] Checkout code'
        uses: actions/checkout@v4
      
      - name: '[Android] Setup Java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: '[Android] Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: '[Android] Get dependencies'
        run: flutter pub get
      
      - name: '[Android] Build APK'
        run: flutter build apk --release
      
      - name: '[Android] Build AAB'
        run: flutter build appbundle --release
      
      - name: '[Android] Package artifacts'
        run: |
          mkdir -p release-files
          cp build/app/outputs/flutter-apk/app-release.apk release-files/onlystream-android.apk
          cp build/app/outputs/bundle/release/app-release.aab release-files/onlystream-android.aab

      - name: '[Android] Upload artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-files/

  build-ios:
    name: '[iOS] Build'
    runs-on: macos-latest
    steps:
      - name: '[iOS] Checkout code'
        uses: actions/checkout@v4
      
      - name: '[iOS] Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: '[iOS] Get dependencies'
        run: flutter pub get
      
      - name: '[iOS] Build iOS'
        run: flutter build ios --release --no-codesign
      
      - name: '[iOS] Package artifact'
        run: |
          mkdir -p release-files
          cd build/ios/iphoneos
          zip -r ../../../release-files/onlystream-ios.zip Runner.app

      - name: '[iOS] Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release-files/

  build-linux:
    name: '[Linux] Build'
    runs-on: ubuntu-latest
    steps:
      - name: '[Linux] Checkout code'
        uses: actions/checkout@v4
      
      - name: '[Linux] Setup dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libgles2-mesa-dev \
            libmpv-dev \
            pkg-config \
            cmake \
            ninja-build \
            libunwind-dev \
            git \
            curl
      
      - name: '[Linux] Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: '[Linux] Enable Linux desktop'
        run: flutter config --enable-linux-desktop
      
      - name: '[Linux] Get dependencies'
        run: flutter pub get
      
      - name: '[Linux] Build Linux'
        run: flutter build linux --release
      
      - name: '[Linux] Package artifact'
        run: |
          mkdir -p release-files
          tar -czvf release-files/onlystream-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: '[Linux] Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-files/

  build-windows:
    name: '[Windows] Build'
    runs-on: windows-latest
    steps:
      - name: '[Windows] Checkout code'
        uses: actions/checkout@v4
      
      - name: '[Windows] Setup Visual Studio'
        uses: microsoft/setup-msbuild@v1
      
      - name: '[Windows] Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: '[Windows] Enable Windows desktop'
        run: flutter config --enable-windows-desktop
      
      - name: '[Windows] Get dependencies'
        run: flutter pub get
      
      - name: '[Windows] Build Windows'
        run: flutter build windows --release
      
      - name: '[Windows] Package artifact'
        run: |
          mkdir release-files
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release-files\onlystream-windows.zip

      - name: '[Windows] Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-files/

  release:
    name: '[Release] Create Release'
    needs: [build-android, build-ios, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: '[Release] Download all artifacts'
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: '[Release] Publish to GitHub Release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Release' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: '[Notify] Check Status'
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-linux, build-windows]
    if: always()
    steps:
      - name: '[Notify] Verify build status'
        run: |
          if [ "${{ needs.build-android.result }}" = "success" ] && \
             [ "${{ needs.build-ios.result }}" = "success" ] && \
             [ "${{ needs.build-linux.result }}" = "success" ] && \
             [ "${{ needs.build-windows.result }}" = "success" ]; then
            echo "[Notify] All builds completed successfully"
            exit 0
          else
            echo "[Notify] Some builds failed"
            exit 1
          fi