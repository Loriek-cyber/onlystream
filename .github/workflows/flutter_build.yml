name: '[OnlyStream] Multi-Platform Build & Release'

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: '[Test] Analyze & Test'
    runs-on: ubuntu-latest
    steps:
      - name: '[Test] Checkout code'
        uses: actions/checkout@v4

      - name: '[Test] Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: '[Test] Get dependencies'
        run: flutter pub get

      - name: '[Test] Analyze'
        run: flutter analyze --no-fatal-infos

      - name: '[Test] Run tests'
        run: flutter test

  build-android:
    name: '[Android] Build'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: '[Android] Checkout code'
        uses: actions/checkout@v4

      - name: '[Android] Setup Java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: '[Android] Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: '[Android] Get dependencies'
        run: flutter pub get

      - name: '[Android] Configure release signing'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            KEYSTORE_FILE="${{ runner.temp }}/onlystream-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
            printf 'ANDROID_KEYSTORE_PATH=%s\n' "$KEYSTORE_FILE" >> "$GITHUB_ENV"
            printf 'ANDROID_KEYSTORE_PASS=%s\n' "$ANDROID_KEYSTORE_PASS" >> "$GITHUB_ENV"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            printf 'ANDROID_KEY_PASS=%s\n' "$ANDROID_KEY_PASS" >> "$GITHUB_ENV"
            echo "Configured Android release signing keystore."
          else
            echo "ANDROID_KEYSTORE_B64 not set; release build will fall back to debug signing."
          fi

      - name: '[Android] Build & Package APKs'
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          DART_DEFINES=()
          if [ -n "$API_URL" ]; then
            DART_DEFINES+=(--dart-define=API_URL="$API_URL")
          fi

          mkdir -p release-files
          flutter build apk --release --split-per-abi "${DART_DEFINES[@]}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/onlystream-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-files/onlystream-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-files/onlystream-x86_64.apk

          flutter build apk --release "${DART_DEFINES[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk release-files/onlystream-universal.apk

      - name: '[Android] Cleanup temporary keystore'
        if: always()
        run: rm -f "${{ runner.temp }}/onlystream-release.jks"

      - name: '[Android] Upload artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-files/

  build-ios:
    name: '[iOS] Build'
    needs: test
    runs-on: macos-latest
    steps:
      - name: '[iOS] Checkout code'
        uses: actions/checkout@v4

      - name: '[iOS] Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: '[iOS] Get dependencies'
        run: flutter pub get

      - name: '[iOS] Build iOS'
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            flutter build ios --release --no-codesign --dart-define=API_URL="$API_URL"
          else
            flutter build ios --release --no-codesign
          fi

      - name: '[iOS] Package artifact'
        run: |
          mkdir -p release-files
          cd build/ios/iphoneos
          zip -r ../../../release-files/onlystream-ios.zip Runner.app

      - name: '[iOS] Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release-files/

  build-linux:
    name: '[Linux] Build'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: '[Linux] Checkout code'
        uses: actions/checkout@v4

      - name: '[Linux] Setup dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libgles2-mesa-dev \
            libmpv-dev \
            pkg-config \
            cmake \
            ninja-build \
            libunwind-dev \
            git \
            curl

      - name: '[Linux] Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: '[Linux] Enable Linux desktop'
        run: flutter config --enable-linux-desktop

      - name: '[Linux] Get dependencies'
        run: flutter pub get

      - name: '[Linux] Build Linux'
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            flutter build linux --release --dart-define=API_URL="$API_URL"
          else
            flutter build linux --release
          fi

      - name: '[Linux] Package artifact'
        run: |
          mkdir -p release-files
          tar -czvf release-files/onlystream-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: '[Linux] Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-files/

  build-windows:
    name: '[Windows] Build'
    needs: test
    runs-on: windows-latest
    steps:
      - name: '[Windows] Checkout code'
        uses: actions/checkout@v4

      - name: '[Windows] Setup Visual Studio'
        uses: microsoft/setup-msbuild@v1

      - name: '[Windows] Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: '[Windows] Enable Windows desktop'
        run: flutter config --enable-windows-desktop

      - name: '[Windows] Get dependencies'
        run: flutter pub get

      - name: '[Windows] Build Windows'
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if ($env:API_URL) {
            flutter build windows --release --dart-define=API_URL="$env:API_URL"
          } else {
            flutter build windows --release
          }

      - name: '[Windows] Package artifact'
        run: |
          mkdir release-files
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release-files\onlystream-windows.zip

      - name: '[Windows] Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-files/

  release:
    name: '[Release] Create Release'
    needs: [test, build-android, build-ios, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      (needs.build-android.result == 'success' ||
       needs.build-ios.result == 'success' ||
       needs.build-linux.result == 'success' ||
       needs.build-windows.result == 'success')
    permissions:
      contents: write
    steps:
      - name: '[Release] Download available artifacts'
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: '[Release] Collect built release files'
        id: collect
        run: |
          shopt -s nullglob
          FILES=(release-artifacts/*.apk release-artifacts/*.tar.gz release-artifacts/*.zip)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release artifacts found to publish."
            exit 1
          fi
          {
            echo "files<<EOF"
            for f in "${FILES[@]}"; do
              echo "$f"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          ls -lh "${FILES[@]}"

      - name: '[Release] Publish to GitHub Release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.collect.outputs.files }}
          fail_on_unmatched_files: false
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Release' }}
          body: |
            Build status:
            - Tests: ${{ needs.test.result }}
            - Android: ${{ needs.build-android.result }}
            - iOS: ${{ needs.build-ios.result }}
            - Linux: ${{ needs.build-linux.result }}
            - Windows: ${{ needs.build-windows.result }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: '[Notify] Check Status'
    runs-on: ubuntu-latest
    needs: [test, build-android, build-ios, build-linux, build-windows]
    if: always()
    steps:
      - name: '[Notify] Verify build status'
        run: |
          echo "Tests:   ${{ needs.test.result }}"
          echo "Android: ${{ needs.build-android.result }}"
          echo "iOS:     ${{ needs.build-ios.result }}"
          echo "Linux:   ${{ needs.build-linux.result }}"
          echo "Windows: ${{ needs.build-windows.result }}"
          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.build-android.result }}" = "success" ] && \
             [ "${{ needs.build-ios.result }}" = "success" ] && \
             [ "${{ needs.build-linux.result }}" = "success" ] && \
             [ "${{ needs.build-windows.result }}" = "success" ]; then
            echo "[Notify] All tests and builds completed successfully"
            exit 0
          else
            echo "[Notify] One or more jobs failed (successful platforms were still released if tests passed)"
            exit 1
          fi
